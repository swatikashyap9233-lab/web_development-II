<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>windows-event</title>
</head>
<body>
    <button onclick="openwindow()">new window</button>
    <button onclick="closewindow()">close</button>
    <script>
        function openwindow(){
            a=window.open("https://www.google.com","_blank",width=800,height=600);
            a.document.write("<p>This is the new window<p>");
        }
        function closewindow(){
            a.move[200,300];
            a.close();
        }

    </script>
</body>
</html>
