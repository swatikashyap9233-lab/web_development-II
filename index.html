            <label>Enquiry no. </label>

            <br>
            <label>Gender</label>

            <input type="ratio" name="gender">
            Male
            <input type="ratio" name="gender">
            Female
            <input type="ratio" name="gender">
            others
            </div>
            <br>

            <label>Address</label>

            <br>

        </form>
    </div>
